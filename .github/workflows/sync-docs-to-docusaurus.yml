name: Sync Docs to External Docusaurus Repo

on:
  workflow_call:
    inputs:
      docs-artifacts-name:
        required: true
        type: string
      release_tag:
        required: true
        type: string
    outputs:
      pull-request-number:
        description: 'The created or updated docs pull request number'
        value: ${{ jobs.sync-docs.outputs.pull-request-number }}
      pull-request-operation:
        description: 'The docs pull request operation performed'
        value: ${{ jobs.sync-docs.outputs.pull-request-operation }}

jobs:
  # Note: Only sync docs when there is a release_tag (semantic-release produced a tag).
  sync-docs:
    runs-on: ubuntu-latest
    if: ${{ inputs.release_tag != '' }}
    outputs:
      pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
      pull-request-operation: ${{ steps.create_pr.outputs.pull-request-operation }}
    concurrency:
      group: docs-update
      cancel-in-progress: true

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history to ensure tagged commits are available
          fetch-tags: true # Ensure tags are fetched as well
          persist-credentials: false

      - name: Checkout Docusaurus repo
        # Target repo name lives in the `DOCS_REPO` repository variable (Settings >
        # Secrets and variables > Actions > Variables), not hardcoded here -- update
        # it there if the docs repo is ever renamed or transferred.
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DOCS_REPO }}
          token: ${{ secrets.GH_TOKEN }}
          ref: main
          path: packages/docusaurus
          persist-credentials: false

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Setup Node.js
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      # Install dependencies for Docusaurus
      - name: Install Docusaurus dependencies
        working-directory: packages/docusaurus
        # This install validates the docs repo's own lockfile as-is (catches a pnpm
        # version mismatch between this monorepo and the docs repo). The subsequent
        # component-library version bump below is a separate, intentional lockfile
        # mutation and is unaffected by --frozen-lockfile here.
        run: pnpm install --frozen-lockfile --lockfile-dir . --ignore-workspace

      - name: Clean Docusaurus docs (preserve _category_.json; delete empty dirs)
        shell: bash
        working-directory: packages/docusaurus
        run: |
          # Delete all files except _category_.json, then remove empty directories
          find docs -depth -mindepth 1 \
            \( -type f ! -name '_category_.json' -delete \) -o \
            \( -type d -empty -delete \)

      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.docs-artifacts-name }}
          path: packages/docusaurus/docs/

      - name: Update package.json in Docusaurus
        working-directory: packages/docusaurus
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm --ignore-workspace --lockfile-dir . add @ongov/ontario-design-system-component-library-react@${RELEASE_TAG#v}

      - name: Version Docusaurus docs
        working-directory: packages/docusaurus
        run: pnpm exec docusaurus docs:version ${{ inputs.release_tag }}

      - name: Validate docs-only change scope
        shell: bash
        run: |
          changed_files="$({
            git diff --name-only
            git diff --name-only --cached
            git ls-files --others --exclude-standard
          } | sort -u)"

          echo 'Changed files:'
          echo "$changed_files"

          unexpected_files="$(echo "$changed_files" | grep -v '^packages/docusaurus/' || true)"
          if [ -n "$unexpected_files" ]; then
            echo 'Unexpected changes detected outside packages/docusaurus:'
            echo "$unexpected_files"
            exit 1
          fi

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN }}
          path: packages/docusaurus
          commit-message: 'docs: update for ${{ inputs.release_tag }}'
          title: 'docs: update for ${{ inputs.release_tag }}'
          body: |
            This PR updates the documentation site for version `${{ inputs.release_tag }}`.
          branch: docs/update-${{ inputs.release_tag }}
          labels: docs-update

      # Target repository below comes from the `DOCS_REPO` repository variable (see
      # the "Checkout Docusaurus repo" step above for details).
      - name: Summarise docs sync
        if: ${{ always() }}
        run: |
          {
            echo '## Sync Docs to Docusaurus'
            echo ''
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Release tag | \`${{ inputs.release_tag }}\` |"
            echo "| Docs artifacts input | \`${{ inputs.docs-artifacts-name }}\` |"
            echo "| Target docs branch | \`docs/update-${{ inputs.release_tag }}\` |"
            echo "| Target repository | \`${{ vars.DOCS_REPO }}\` |"
            echo "| Create PR step | \`${{ steps.create_pr.outcome }}\` |"
            if [ -n "${{ steps.create_pr.outputs.pull-request-number }}" ]; then
              echo "| Docs PR | [#${{ steps.create_pr.outputs.pull-request-number }}](${{ github.server_url }}/${{ vars.DOCS_REPO }}/pull/${{ steps.create_pr.outputs.pull-request-number }}) |"
            else
              echo '| Docs PR | No docs PR number returned |'
            fi
            if [ -n "${{ steps.create_pr.outputs.pull-request-operation }}" ]; then
              echo "| PR result | \`${{ steps.create_pr.outputs.pull-request-operation }}\` |"
            else
              echo '| PR result | No docs PR operation reported |'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
