name: Build

on:
  workflow_call:
    inputs:
      build-artifacts-name:
        required: true
        type: string
      docs-artifacts-name:
        required: true
        type: string
    outputs: # https://docs.github.com/en/actions/using-jobs/defining-outputs-for-jobs
      build-artifacts-name:
        description: 'Name of the artifacts archive of the built libraries'
        value: ${{ inputs.build-artifacts-name }}
      docs-artifacts-name:
        description: 'Name of the artifacts archive of the built docs'
        value: ${{ inputs.docs-artifacts-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v6

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Setup Node.js
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      # Install dependencies with lockfile verification
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Make directories for documentation files
      - name: Make directories for documentation files
        run: mkdir -p packages/docusaurus/docs/components

      # Build the project
      - name: Build the project
        id: build_project
        run: pnpm run build-libs

      # Stencil regenerates these tracked files on every build (components.d.ts,
      # Angular stencil-generated wrappers, and component readme.md files). If a PR
      # changes component types/props/JSDoc without running `pnpm build-libs` locally,
      # these files drift out of sync with source and the mismatch previously went
      # undetected until the release pipeline's dirty-tree check failed at publish time.
      # Fail fast here instead, right after the build that regenerates them.
      - name: Check for uncommitted Stencil-generated file drift
        id: drift_check
        run: |
          tracked_generated_files=(
            'packages/ontario-design-system-component-library/src/components.d.ts'
            'packages/ontario-design-system-component-html-generator/src/components.d.ts'
            'packages/ontario-design-system-component-library-angular/projects/component-library/src/lib/stencil-generated'
            'packages/ontario-design-system-component-library/src/components/**/readme.md'
          )

          if ! git diff --exit-code -- "${tracked_generated_files[@]}"; then
            echo '::error::Stencil-generated tracked files are out of sync with source.'
            echo 'The files below changed after running `pnpm build-libs`, which means they were not regenerated and committed locally before this PR.'
            echo ''
            git diff --name-only -- "${tracked_generated_files[@]}"
            echo ''
            echo 'Run `pnpm build-libs` locally, commit the updated files, and push again.'
            exit 1
          fi

          echo 'No Stencil-generated file drift detected.'

      # Upload build artifacts
      - name: Upload build artifacts
        id: upload_build_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.build-artifacts-name }} # Artifact name
          compression-level: 9 # Best compression
          path: | # Collect all package artifacts
            packages/**/*
            !**/node_modules/**/*
            !packages/docusaurus/**/*

      # Upload docs artifact
      - name: Upload docs artifact
        id: upload_docs_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.docs-artifacts-name }}
          compression-level: 9 # Best compression
          path: packages/docusaurus/docs/

      - name: Summarise build outputs
        if: ${{ always() }}
        run: |
          build_size="$(du -sh --exclude docusaurus packages 2>/dev/null | cut -f1)"
          docs_size="$(du -sh packages/docusaurus/docs 2>/dev/null | cut -f1)"

          {
            echo '## Build'
            echo ''
            echo "| Repository | Event | Ref | SHA | Run | Build Step | Drift Check |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            echo "| \`${{ github.repository }}\` | \`${{ github.event_name }}\` | \`${{ github.ref_name }}\` | \`${{ github.sha }}\` | [#${{ github.run_number }} attempt ${{ github.run_attempt }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | \`${{ steps.build_project.outcome }}\` | \`${{ steps.drift_check.outcome }}\` |"
            echo ''
            echo '### Artifacts'
            echo ''
            echo "| Artifact | Name | Size | Upload |"
            echo "| --- | --- | --- | --- |"
            echo "| Build | \`${{ inputs.build-artifacts-name }}\` | \`${build_size:-unknown}\` | \`${{ steps.upload_build_artifacts.outcome }}\` |"
            echo "| Docs | \`${{ inputs.docs-artifacts-name }}\` | \`${docs_size:-unknown}\` | \`${{ steps.upload_docs_artifact.outcome }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
