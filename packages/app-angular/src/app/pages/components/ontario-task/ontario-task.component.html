<h1>OntarioTask</h1>

<h2>'language' Prop Variants</h2>
<h3>EN</h3>
<ontario-task taskId="task-en" label="English Task" language="en"></ontario-task>

<h3>FR</h3>
<ontario-task taskId="task-fr" label="Tâche en français" language="fr"></ontario-task>

<h2>'task-status' Prop Variants</h2>
<ontario-task taskId="task-notstarted" label="Task Not Started" taskStatus="notStarted"></ontario-task>

<h3>In progress</h3>
<ontario-task taskId="task-inprogress" label="Task In Progress" taskStatus="inProgress"></ontario-task>

<h3>Completed</h3>
<ontario-task taskId="task-completed" label="Task Completed" taskStatus="completed"></ontario-task>

<h2>'headingLevel' - Prop Variants</h2>
<h3>H2</h3>
<ontario-task taskId="task-h2" label="Heading Level H2" headingLevel="h2"></ontario-task>

<h3>H3</h3>
<ontario-task taskId="task-h3" label="Heading Level H3" headingLevel="h3"></ontario-task>

<h3>H4</h3>
<ontario-task taskId="task-h4" label="Heading Level H4" headingLevel="h4"></ontario-task>

<h2>'deavtivate-link' - Prop Variants</h2>
<h3>True</h3>
<ontario-task
	taskId="task-deactivated"
	label="Deactivated Link Task"
	link="https://example.com"
	[deactivateLink]="true"
></ontario-task>

<h3>False</h3>
<ontario-task
	taskId="task-active"
	label="Active Link Task"
	link="https://example.com"
	[deactivateLink]="false"
></ontario-task>

<h2>hintText - string</h2>
<ontario-task
	taskId="task-hint-string"
	label="Task with Hint (String)"
	hintText="This is a simple hint string."
></ontario-task>
