<h1>ontario-checkboxes (Client Side)</h1>

<div>
	<h2>Custom Event Props</h2>

	<ontario-checkboxes
		[caption]="caption"
		name="checkbox-caption-default"
		[options]="options"
		[customOnChange]="customOnChange"
		[customOnFocus]="customOnFocus"
		[customOnBlur]="customOnBlur"
	></ontario-checkboxes>
</div>
