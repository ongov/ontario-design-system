<h1>ontario-language-toggle</h1>

<h2>'language' Prop Variants</h2>
<h3>EN</h3>
<ontario-language-toggle language="en"></ontario-language-toggle>

<h3>FR</h3>
<ontario-language-toggle language="fr"></ontario-language-toggle>

<h2>'size' Prop Variants</h2>
<h3>default</h3>
<ontario-language-toggle size="default"></ontario-language-toggle>

<h3>small</h3>
<ontario-language-toggle size="small"></ontario-language-toggle>

<h2>'url' Prop Variant</h2>
<ontario-language-toggle url="https://example.com/fr"></ontario-language-toggle>

<h2>'customLanguageToggle' Prop Variant</h2>
<ontario-language-toggle [customLanguageToggle]="handleCustomToggle"></ontario-language-toggle>
