<h1>ontario-radio-buttons (Client Side)</h1>

<div>
	<h2>Custom Event Props</h2>

	<ontario-radio-buttons
		[caption]="caption"
		name="radio-button-caption-default"
		[options]="options"
		[customOnChange]="handleChange"
		[customOnFocus]="handleFocus"
		[customOnBlur]="handleBlur"
	></ontario-radio-buttons>
</div>
