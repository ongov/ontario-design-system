<h1>language-sync</h1>

<h2>Header and footer without a "language" prop</h2>

<ontario-header
	id="language-sync-header"
	type="application"
	[applicationHeaderInfo]="applicationHeaderInfo"
	[customLanguageToggle]="preventToggleNavigation"
	assetBasePath="/assets"
></ontario-header>

<ontario-footer id="language-sync-footer" type="default" assetBasePath="/assets"></ontario-footer>
