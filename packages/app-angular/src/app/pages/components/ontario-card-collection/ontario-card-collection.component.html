<h1>ontario-card-collection</h1>

<h2>'cards-per-row' Prop Variants</h2>
<h3>4</h3>
<ontario-card-collection [cardsPerRow]="4">
	<ontario-card [description]="description" label="Card Title 1"></ontario-card>
	<ontario-card [description]="description" headerColour="purple" label="Card Title 2"></ontario-card>
	<ontario-card label="Card Title 3"></ontario-card>
	<ontario-card headerColour="blue" label="Card Title 4"></ontario-card>
</ontario-card-collection>

<h3>3</h3>
<ontario-card-collection [cardsPerRow]="3">
	<ontario-card [description]="description" label="Card Title 1"></ontario-card>
	<ontario-card [description]="description" headerColour="sky" label="Card Title 2"></ontario-card>
	<ontario-card label="Card Title 3"></ontario-card>
</ontario-card-collection>

<h3>2</h3>
<ontario-card-collection [cardsPerRow]="2">
	<ontario-card [description]="description" label="Card Title 1"></ontario-card>
	<ontario-card [description]="description" headerColour="sky" label="Card Title 2"></ontario-card>
</ontario-card-collection>
