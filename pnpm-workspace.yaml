packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  nx: false
  puppeteer: false
  sharp: false
  unrs-resolver: false
# Ensure semantic-release runs the same patched GitHub plugin declared at the workspace root.
overrides:
  'semantic-release>@semantic-release/github': 12.0.10
  # sync-child-process <1.1.1 can corrupt sass-embedded's sync compiler output on Node 24.22+
  # ("Invalid protobuf"). Drop once sass-embedded requires ^1.1.1:
  # https://github.com/sass/embedded-host-node/issues/451
  sync-child-process: ^1.1.1
patchedDependencies:
  '@semantic-release/github@12.0.10': patches/@semantic-release__github@12.0.10.patch
  # Forwards `slot` to the wrapper element. Drop this patch once a release includes the upstream fix:
  # https://github.com/stenciljs/output-targets/pull/863 (issue: https://github.com/stenciljs/output-targets/issues/858)
  '@stencil/ssr@0.4.0': patches/@stencil__ssr@0.4.0.patch
  conventional-changelog-angular@8.0.0: patches/conventional-changelog-angular@8.0.0.patch
